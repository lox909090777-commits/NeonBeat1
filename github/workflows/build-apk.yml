name: Build NeonBeat APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack Android project
        run: |
          unzip -o NeonBeat-Android-Project.zip -d .
          test -d NeonBeat/app
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        working-directory: NeonBeat
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonBeat-debug-apk
          path: NeonBeat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
